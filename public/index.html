<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Minimi</title>
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Conversations">
        <div class="sidebar-head">
          <div class="brand"><span class="logo" aria-hidden="true"></span>Minimi</div>
          <button class="btn btn-primary" id="new-chat" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" /></svg>
            New chat
          </button>
        </div>
        <nav class="conv-list" id="conv-list"></nav>
      </aside>
      <div class="scrim" id="scrim" hidden></div>

      <main class="main">
        <header class="topbar">
          <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Show conversations">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" /></svg>
          </button>
          <h1 class="conv-title" id="conv-title">New chat</h1>
        </header>

        <div class="banner" id="banner" hidden></div>

        <section class="thread" id="thread" aria-live="polite">
          <div class="empty" id="empty">
            <h2>What do you want to know?</h2>
            <p>I search the web for anything current and remember our past conversations by date.</p>
            <div class="suggestions" id="suggestions"></div>
          </div>
          <div class="messages" id="messages"></div>
        </section>

        <form class="composer" id="composer">
          <div class="composer-box">
            <textarea
              id="input"
              rows="1"
              placeholder="Ask anything…"
              aria-label="Message"
              autocomplete="off"
            ></textarea>
            <button class="send-btn" id="send" type="submit" aria-label="Send">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4M5 9l5-5 5 5" /></svg>
            </button>
            <button class="send-btn stop" id="stop" type="button" aria-label="Stop" hidden>
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <rect x="5" y="5" width="10" height="10" rx="2" />
              </svg>
            </button>
          </div>
          <p class="hint">Enter to send · Shift+Enter for a new line</p>
        </form>
      </main>
    </div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
